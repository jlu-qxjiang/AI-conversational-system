<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欢迎登录 - AI 智能助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 450px;
      width: 100%;
      background: white;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 头部装饰 */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px 30px;
      text-align: center;
      position: relative;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -20px;
      left: -20px;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -20px;
      right: -20px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .logo {
      font-size: 56px;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .header h1 {
      color: white;
      font-size: 28px;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    .header p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      margin-top: 8px;
      position: relative;
      z-index: 1;
    }

    /* 表单区域 */
    .form-container {
      padding: 40px 32px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      outline: none;
      transition: all 0.3s;
      background: #f9fafb;
    }

    .input-group input:focus {
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .input-group input::placeholder {
      color: #9ca3af;
    }

    /* 登录按钮 */
    .login-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    /* 消息提示 */
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .message.error {
      background: #fee2e2;
      color: #dc2626;
      display: block;
    }

    .message.success {
      background: #d1fae5;
      color: #059669;
      display: block;
    }

    /* 注册链接 */
    .register-link {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
      font-size: 14px;
      color: #6b7280;
    }

    .register-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      margin-left: 5px;
      transition: color 0.3s;
    }

    .register-link a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    /* 加载状态 */
    .login-btn.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .login-btn.loading::after {
      content: '...';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🤖</div>
      <h1>欢迎回来</h1>
      <p>登录你的 AI 智能助手账号</p>
    </div>

    <div class="form-container">
      <div class="input-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
      </div>

      <div class="input-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" onkeypress="if(event.key==='Enter') login()">
      </div>

      <button class="login-btn" onclick="login()" id="loginBtn">登录</button>

      <div id="status" class="message"></div>

      <div class="register-link">
        还没有账号？
        <a href="register.html">立即注册</a>
      </div>
    </div>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const statusDiv = document.getElementById('status');
      const loginBtn = document.getElementById('loginBtn');

      // 表单验证
      if (!username || !password) {
        showMessage('请输入用户名和密码', 'error');
        return;
      }

      // 显示加载状态
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;
      statusDiv.style.display = 'none';

      try {
        const res = await fetch('/ai/v1/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.code === 1000 && data.data && data.data.token) {
          // 登录成功
          showMessage('登录成功！正在跳转...', 'success');
          const token = data.data.token;
          localStorage.setItem('token', token);

          // 解析 token 获取 role
          let role = 0;
          try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            role = payload.role;
          } catch (e) {
            console.warn('解析 token 失败', e);
          }

          setTimeout(() => {
            if (role === 1) {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'chat.html';
            }
          }, 1000);
        } else {
          // 登录失败
          showMessage(data.msg || data.detail || '用户名或密码错误', 'error');
          loginBtn.classList.remove('loading');
          loginBtn.disabled = false;
        }
      } catch (error) {
        console.error('登录请求失败:', error);
        showMessage('网络错误，请检查服务器是否启动', 'error');
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
      }
    }

    function showMessage(msg, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = msg;
      statusDiv.className = `message ${type}`;
      statusDiv.style.display = 'block';
    }

    // 自动清除输入框两侧空格
    document.getElementById('username').addEventListener('blur', function() {
      this.value = this.value.trim();
    });
  </script>
</body>
</html>
