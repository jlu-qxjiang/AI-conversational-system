<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聊天系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logout-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }

    .message {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .user-message, .ai-message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      word-wrap: break-word;
      line-height: 1.5;
    }

    .user-message {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai-message {
      align-self: flex-start;
      background: white;
      color: #333;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .message-label {
      font-size: 12px;
      margin-bottom: 5px;
      opacity: 0.7;
    }

    .input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      gap: 10px;
    }

    .input-wrapper input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #667eea;
    }

    .send-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      transition: opacity 0.2s;
    }

    .send-btn:hover {
      opacity: 0.9;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🤖 AI 智能助手</h1>
    <div class="user-info">
      <span id="username">加载中...</span>
      <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
  </div>

  <div class="chat-area" id="chat"></div>

  <div class="input-area">
    <div class="input-wrapper">
      <input type="text" id="question" placeholder="输入你的问题..." onkeypress="if(event.key==='Enter') ask()">
      <button class="send-btn" onclick="ask()">发送</button>
    </div>
  </div>
</div>

<script>
  // ---------- 认证与用户信息 ----------
  const token = localStorage.getItem('token');
  if (!token) {
    alert("未登录，请先登录！");
    window.location.href = '/page/index.html';
  }

  function parseTokenUsername(token) {
    try {
      const payloadBase64 = token.split('.')[1];
      if (!payloadBase64) return '用户';
      const payloadJson = atob(payloadBase64);
      const payload = JSON.parse(payloadJson);
      return payload.username || payload.user_name || payload.sub || '用户';
    } catch (err) {
      console.warn('解析 token 失败', err);
      return '用户';
    }
  }

  document.getElementById('username').innerText = parseTokenUsername(token);

  function logout() {
    localStorage.removeItem('token');
    window.location.href = '/page/index.html';
  }

  // ---------- 辅助函数 ----------
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function scrollToBottom() {
    const chatDiv = document.getElementById('chat');
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  // ---------- 核心聊天逻辑 ----------
  async function ask() {
    const questionInput = document.getElementById('question');
    const question = questionInput.value.trim();
    if (!question) return;

    const chatDiv = document.getElementById('chat');

    // 显示用户消息
    chatDiv.innerHTML += `
      <div class="message">
        <div class="user-message">
          <div class="message-label">你</div>
          ${escapeHtml(question)}
        </div>
      </div>
    `;
    questionInput.value = '';
    scrollToBottom();

    // 显示“正在输入”指示器
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'message';
    loadingDiv.id = 'loadingIndicator';
    loadingDiv.innerHTML = `
      <div class="ai-message">
        <div class="message-label">AI</div>
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    `;
    chatDiv.appendChild(loadingDiv);
    scrollToBottom();

    try {
      const response = await fetch('/ai/v1/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ session_id: 'default', question })
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }

      const result = await response.json();
      console.log('完整响应:', result);
      loadingDiv.remove();

      // 正常显示纯文本回答
      const answer = result.data?.answer || "AI 未返回有效回答";
      chatDiv.innerHTML += `
        <div class="message">
          <div class="ai-message">
            <div class="message-label">AI</div>
            ${escapeHtml(answer)}
          </div>
        </div>
      `;

      scrollToBottom();
    } catch (err) {
      console.error('请求异常:', err);
      loadingDiv.remove();
      chatDiv.innerHTML += `
        <div class="message">
          <div class="ai-message">
            <div class="message-label">AI</div>
            网络请求异常，请稍后重试。
          </div>
        </div>
      `;
      scrollToBottom();
    }
  }

  // 欢迎消息
  window.addEventListener('DOMContentLoaded', () => {
    const chatDiv = document.getElementById('chat');
    if (chatDiv.children.length === 0) {
      chatDiv.innerHTML = `
        <div class="message">
          <div class="ai-message">
            <div class="message-label">AI</div>
            你好！我是 AI 智能助手，请问有什么可以帮您？
          </div>
        </div>
      `;
    }
  });
</script>
</body>
</html>
